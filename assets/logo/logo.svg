<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0086C9"/>
      <stop offset="100%" stop-color="#00D9A3"/>
    </linearGradient>
  </defs>

  <!-- Órbita 1 (horizontal) -->
  <ellipse cx="100" cy="100" rx="70" ry="26"
           fill="none" stroke="url(#grad)" stroke-width="4"/>

  <!-- Órbita 2 (rotada 60°) -->
  <ellipse cx="100" cy="100" rx="70" ry="26"
           fill="none" stroke="url(#grad)" stroke-width="4"
           transform="rotate(60 100 100)"/>

  <!-- Órbita 3 (rotada 120°) -->
  <ellipse cx="100" cy="100" rx="70" ry="26"
           fill="none" stroke="url(#grad)" stroke-width="4"
           transform="rotate(120 100 100)"/>

  <!-- Núcleo central -->
  <circle cx="100" cy="100" r="9" fill="#00D9A3"/>
  <circle cx="100" cy="100" r="5" fill="#FFFFFF"/>

  <!-- Electrones (nodos) -->
  <circle cx="170" cy="100" r="4.5" fill="#00D9A3"/>
  <circle cx="30"  cy="100" r="4.5" fill="#00D9A3"/>
  <circle cx="135" cy="39"  r="4.5" fill="#00D9A3"/>
  <circle cx="65"  cy="161" r="4.5" fill="#00D9A3"/>
</svg>